<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Locked In — leaning forward to focus</title>
  <rect width="96" height="96" rx="20" fill="#F4F3EF"/>
  <!-- A blue arrow captures the shift from sitting back to leaning in. -->
  <path d="M17 17Q35 10 51 22M43 11l10 12-16 2" stroke="#2949A3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The previous posture is a quiet echo behind the focused figure. -->
  <g stroke="#A5A5A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <circle cx="32" cy="34" r="7"/>
    <path d="M28 42 26 58 49 62M36 43l8 15 13 2"/>
  </g>
  <!-- Chair and base. -->
  <path d="m20 47 4 20q13 7 30 0l-8-6-16-3-5-11Z" fill="#2949A3" stroke="#202125" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 71v11m-13 4 13-5 14 5" stroke="#202125" stroke-width="3" stroke-linecap="round"/>
  <!-- Forward posture, bent knees, and hands resting in front. -->
  <g stroke="#202125" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 36q-10 2-15 11l-6 13 26 5 7 16 12-1-6-23-21-5 8-12" fill="#F4F3EF"/>
    <path d="m48 44 3 12 18 3 5-4M55 65l-2 17 12 3"/>
    <path d="m62 81 1 6h17q1-3-7-5M53 82l-3 5H61" fill="#F4F3EF"/>
    <path d="M54 19q-8 1-8 10l4 9 9 3 5-6 5-1-5-6-1-7Z" fill="#F4F3EF"/>
  </g>
  <path d="M46 30q-5-14 8-15l7 2 5-3-1 8-5 3-6-3-2 10Z" fill="#202125"/>
  <path d="m60 28 3 1" stroke="#202125" stroke-width="2" stroke-linecap="round"/>
</svg>
